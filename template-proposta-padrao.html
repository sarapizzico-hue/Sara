<!doctype html>
<!--
  Padrão de proposta (visual da Estruturação Comercial G6).
  Como adaptar: abra guia-proposta-padrao.html, preencha a ficha,
  depois edite o objeto PROPOSTA neste arquivo (narrativa, dados, produto, decisão).
  Atalhos: setas / espaço · G mostra o ato do slide · ?mapa=1 inclui o mapa interno.
-->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Padrão de proposta · Narrativa · Dados · Produto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>








    :root {
      --v4-red: #e50914;
      --v4-red-hover: #c40712;
      --v4-orange: #ff481f;
      --v4-flame: #f0141e;
      --v4-dark: #280001;
      --v4-darker: #280000;
      --v4-grey: #e1dcdc;
      --v4-white: #ffffff;
      --v4-cream: #ffebc8;
      --v4-salmon: #ffb4a0;
      --ink: #141414;
      --ink-soft: #5a5a5a;
      --line: rgba(20, 20, 20, .12);
      --radius: 22px;
      --radius-pill: 999px;
      --hero: radial-gradient(120% 130% at 50% -10%, #ff5a2c 0%, #e50914 30%, #b00610 62%, #280001 100%);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171313;
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button { font-family: inherit; }

    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 10%, rgba(229, 9, 20, .18), transparent 38%),
        #171313;
    }

    #deck {
      --deck-scale: 1;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1600px;
      height: 900px;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--deck-scale));
      transform-origin: center;
      background: #f5f4f2;
      box-shadow: 0 40px 120px rgba(0, 0, 0, .45);
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 1600px;
      height: 900px;
      padding: 76px 96px 108px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateX(24px);
      transition: opacity .28s ease, transform .28s ease;
      background:
        radial-gradient(circle at 92% 8%, rgba(229, 9, 20, .055), transparent 24%),
        #f5f4f2;
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
    }

    .slide.red {
      color: white;
      background: var(--hero);
    }

    .slide.dark {
      color: white;
      background:
        radial-gradient(circle at 78% 15%, rgba(229, 9, 20, .5), transparent 32%),
        linear-gradient(145deg, #280001 0%, #130001 100%);
    }

    .slide.white { background: white; }

    .topline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: linear-gradient(90deg, var(--v4-red), var(--v4-orange), transparent 76%);
    }

    h1,
    h2,
    h3,
    p { margin-top: 0; }

    h1 {
      margin-bottom: 24px;
      font-size: 88px;
      line-height: .98;
      letter-spacing: -.055em;
      font-weight: 600;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 60px;
      line-height: 1.02;
      letter-spacing: -.045em;
      font-weight: 600;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 26px;
      line-height: 1.1;
      letter-spacing: -.025em;
      font-weight: 600;
    }

    .lede {
      max-width: 1000px;
      color: var(--ink-soft);
      font-size: 27px;
      line-height: 1.42;
      font-weight: 300;
    }

    .red .lede,
    .dark .lede { color: rgba(255, 255, 255, .72); }

    .accent { color: var(--v4-red); }
    .red .accent,
    .dark .accent { color: var(--v4-cream); }

    .mono { font-family: "IBM Plex Mono", monospace; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 7px 15px;
      border: 1px solid rgba(229, 9, 20, .18);
      border-radius: var(--radius-pill);
      color: var(--v4-red);
      background: rgba(229, 9, 20, .07);
      font-size: 12px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .red .eyebrow,
    .dark .eyebrow {
      color: rgba(255, 255, 255, .92);
      background: rgba(255, 255, 255, .06);
      border-color: rgba(255, 255, 255, .35);
      box-shadow:
        inset 0 0 80px rgba(255, 255, 255, .12),
        inset 0 1px 8px rgba(255, 255, 255, .35),
        -5px 5px 20px rgba(0, 0, 0, .10);
      backdrop-filter: blur(14px) saturate(140%);
    }

    .card {
      position: relative;
      padding: 28px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
    }

    .glass {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, .06);
      box-shadow:
        inset 0 0 150px rgba(255, 255, 255, .13),
        inset 0 1px 10px rgba(255, 255, 255, .38),
        inset 0 -2px 10px rgba(255, 255, 255, .22),
        inset 0 0 100px rgba(255, 255, 255, .08),
        -5px 5px 20px rgba(0, 0, 0, .10);
      backdrop-filter: blur(14px) saturate(140%);
    }

    .glass::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background:
        radial-gradient(120% 90% at 50% 115%, rgba(255, 170, 80, .34), transparent 55%),
        linear-gradient(180deg, rgba(255, 255, 255, .22), transparent 40%);
      mix-blend-mode: screen;
    }

    .sphere {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, .24);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .38), rgba(255, 255, 255, .045) 48%, transparent 66%);
      box-shadow:
        inset 0 0 120px rgba(255, 255, 255, .13),
        inset 25px 18px 70px rgba(255, 160, 70, .28);
      backdrop-filter: blur(3px);
    }

    .icon {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-box {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid rgba(229, 9, 20, .18);
      border-radius: 17px;
      color: var(--v4-red);
      background: rgba(229, 9, 20, .07);
    }

    .red .icon-box,
    .dark .icon-box {
      color: white;
      border-color: rgba(255, 255, 255, .28);
      background: rgba(255, 255, 255, .08);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }

    .big-number {
      color: var(--v4-red);
      font-size: 72px;
      line-height: 1;
      letter-spacing: -.06em;
      font-weight: 700;
    }

    .metric-label {
      margin-top: 8px;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.2;
    }

    .bullet-list {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 76px;
      padding: 14px 18px;
      border: 1px solid rgba(20, 20, 20, .08);
      border-radius: 17px;
      background: rgba(255, 255, 255, .74);
      font-size: 21px;
      line-height: 1.2;
    }

    .hub-layout {
      position: relative;
      height: 540px;
      isolation: isolate;
    }

    .hub-line {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 420px;
      height: 420px;
      border: 1px dashed rgba(229, 9, 20, .26);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .hub {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 50%;
      width: 240px;
      height: 240px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--hero);
      box-shadow: 0 30px 80px rgba(229, 9, 20, .3);
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .hub-node {
      position: absolute;
      z-index: 2;
      width: 240px;
      min-height: 110px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px;
      animation: node-float 5.2s ease-in-out infinite;
      will-change: transform;
    }

    .node-nw { left: 65px; top: 38px; animation-delay: -.6s; }
    .node-ne { right: 65px; top: 38px; animation-delay: -1.8s; }
    .node-sw { left: 65px; bottom: 38px; animation-delay: -2.8s; }
    .node-se { right: 65px; bottom: 38px; animation-delay: -3.8s; }

    .cover-content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 26px;
    }

    .brand-lockup img {
      width: 330px;
      display: block;
      object-fit: contain;
    }

    .cover-title {
      max-width: 1100px;
      margin: 28px 0 0;
      font-size: 92px;
    }

    .slide-footer {
      position: absolute;
      z-index: 8;
      left: 96px;
      right: 96px;
      bottom: 32px;
      height: 48px;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .slide-footer img {
      width: 155px;
      height: 48px;
      object-fit: contain;
      object-position: left center;
    }

    .navigation {
      position: absolute;
      z-index: 20;
      right: 52px;
      bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-btn {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(20, 20, 20, .12);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
      cursor: pointer;
      transition: transform .15s ease, background .15s ease, opacity .15s ease;
    }

    .nav-btn:hover { transform: translateY(-2px); background: white; }
    .nav-btn:disabled { opacity: .3; cursor: default; transform: none; }

    .progress-track {
      position: absolute;
      z-index: 21;
      left: 0;
      right: 0;
      bottom: 0;
      height: 7px;
      background: rgba(20, 20, 20, .1);
    }

    .progress-fill {
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, var(--v4-red), var(--v4-orange));
      box-shadow: 0 0 20px rgba(229, 9, 20, .35);
      transition: width .3s ease;
    }

    .slide-counter {
      position: absolute;
      z-index: 22;
      right: 176px;
      bottom: 39px;
      color: rgba(20, 20, 20, .52);
      font: 500 12px/1 "IBM Plex Mono", monospace;
      letter-spacing: .04em;
    }


    /* Deck-renderer applied layouts */
    .profile-grid{display:grid;grid-template-columns:1fr 430px;gap:84px;align-items:center;margin-top:44px}.profile-photo{height:560px;border-radius:28px;overflow:hidden;border:1px solid rgba(20,20,20,.12);background:#280001}.profile-photo img{width:100%;height:100%;object-fit:cover;object-position:center top}.badge-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.badge{display:inline-flex;align-items:center;min-height:34px;padding:8px 14px;border-radius:999px;color:var(--v4-red);background:rgba(229,9,20,.07);border:1px solid rgba(229,9,20,.18);font:700 12px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.metric-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:50px}.metric-wall.four{grid-template-columns:repeat(4,1fr)}.metric-card{min-height:270px;padding:32px;border-radius:24px}.metric-card p{margin:0;color:var(--ink-soft);font-size:20px;line-height:1.32}.dark .metric-card p,.red .metric-card p{color:rgba(255,255,255,.72)}.source{position:absolute;left:96px;bottom:86px;max-width:1020px;color:rgba(20,20,20,.44);font:500 11px/1.25 "IBM Plex Mono",monospace}.dark .source,.red .source{color:rgba(255,255,255,.42)}.diagnosis-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:28px;margin-top:44px}.stack{display:grid;gap:16px}.line-card{display:grid;grid-template-columns:58px 1fr;gap:18px;align-items:center;min-height:104px;padding:18px 22px;border-radius:20px;background:rgba(255,255,255,.78);border:1px solid var(--line)}.dark .line-card{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16)}.line-card h3{margin:0 0 5px;font-size:25px}.line-card p{margin:0;color:var(--ink-soft);font-size:18px;line-height:1.32}.dark .line-card p{color:rgba(255,255,255,.72)}.quote{margin-top:42px;padding-left:26px;border-left:6px solid var(--v4-red);max-width:1040px;font-size:31px;line-height:1.2;font-weight:600}.dark .quote,.red .quote{border-color:var(--v4-cream)}.table-layout{display:grid;grid-template-columns:1fr 315px;gap:40px;margin-top:42px}.table{width:100%;border-collapse:collapse}.table th{padding:16px 14px;border-bottom:1px solid var(--line);color:var(--v4-red);text-align:left;font:700 12px/1.15 "IBM Plex Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.table td{padding:18px 14px;border-bottom:1px solid var(--line);color:var(--ink-soft);font-size:20px;line-height:1.26}.table tr:nth-child(even) td{background:rgba(229,9,20,.055)}.side-metric{padding-bottom:22px;border-bottom:1px solid var(--line)}.side-metric .big-number{font-size:66px}.side-metric p{margin:8px 0 0;color:var(--ink-soft);font-size:18px;line-height:1.3}.bowtie-card{margin-top:30px;width:1180px;height:390px;padding:18px;border-radius:22px;border:1px solid var(--line);background:white}.process{display:flex;align-items:stretch;gap:10px;margin-top:46px}.stage{flex:1;min-height:136px;padding:22px 18px;border-radius:19px;background:white;border:1px solid var(--line)}.dark .stage{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18)}.stage h3{font-size:21px;margin-bottom:9px}.stage p{margin:0;color:var(--ink-soft);font-size:16px;line-height:1.25}.dark .stage p{color:rgba(255,255,255,.72)}.arrow{display:grid;place-items:center;color:var(--v4-red);font-size:30px;font-weight:700}.funnel-area{display:grid;grid-template-columns:860px 1fr;gap:52px;align-items:center;margin-top:28px}.funnel{display:flex;flex-direction:column;align-items:center;gap:9px}.funnel-step{height:58px;display:flex;align-items:center;justify-content:center;color:white;background:linear-gradient(90deg,var(--v4-red),var(--v4-dark));border-radius:8px;font-weight:600}.funnel-step strong{font-size:25px;margin-right:10px}.funnel-step span{font-size:20px;color:rgba(255,255,255,.82)}.funnel-note{font-size:26px;line-height:1.35;color:var(--ink-soft)}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 34px;margin-top:44px}.check-card{display:grid;grid-template-columns:58px 1fr;gap:18px;align-items:center;min-height:88px;padding:18px;border-radius:20px;background:white;border:1px solid var(--line)}.check-card h3{font-size:23px;margin:0}
    .bowtie-image-stage{position:absolute;left:96px;right:96px;top:204px;bottom:76px;display:flex;align-items:center;justify-content:center;overflow:hidden}.bowtie-image-stage img{width:auto;height:100%;max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:18px;border:1px solid var(--line);background:white;box-shadow:0 22px 70px rgba(20,20,20,.12)}.diagram-slide .eyebrow{position:relative;z-index:3}.diagram-slide h2{position:relative;z-index:3;font-size:48px;max-width:920px;margin-top:24px}.diagram-slide .source{left:320px;right:320px;bottom:38px;max-width:none;text-align:center}
    @keyframes node-float {
      0%, 100% { transform: var(--node-base, translate(0, 0)) translateY(0) rotate(0deg); }
      25% { transform: var(--node-base, translate(0, 0)) translateY(-9px) rotate(-1.5deg); }
      50% { transform: var(--node-base, translate(0, 0)) translateY(3px) rotate(1deg); }
      75% { transform: var(--node-base, translate(0, 0)) translateY(-5px) rotate(.5deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  

    /* G6 customizations */
    .brand-lockup { display:flex; align-items:center; gap:18px; }
    .brand-lockup img { height:42px; width:auto; object-fit:contain; }
    .brand-lockup .x { opacity:.55; font-weight:600; font-size:22px; }
    .partner-pill {
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 16px; border-radius:999px;
      background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
      font:600 14px/1 "IBM Plex Mono", monospace; letter-spacing:.06em; text-transform:uppercase;
    }
    .partner-pill img { height:22px; width:auto; background:#fff; border-radius:6px; padding:2px 6px; }
    .split-2 { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:40px; }
    .split-card { padding:28px 30px; border-radius:24px; border:1px solid var(--line); background:white; min-height:360px; }
    .dark .split-card { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.16); }
    .split-card h3 { margin:0 0 18px; font-size:28px; }
    .split-card ul { margin:0; padding-left:20px; color:var(--ink-soft); font-size:20px; line-height:1.45; }
    .dark .split-card ul { color:rgba(255,255,255,.75); }
    .split-card li { margin:10px 0; }
    .split-card.ok { border-color:rgba(229,9,20,.25); }
    .split-card.gap { background:linear-gradient(180deg, rgba(229,9,20,.06), white); }
    .dark .split-card.gap { background:rgba(229,9,20,.16); }
    .phase-rail {
      display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-top:40px;
    }
    .phase {
      min-height:280px; padding:20px 16px; border-radius:20px;
      background:white; border:1px solid var(--line);
    }
    .dark .phase { background:rgba(255,255,255,.07); border-color:rgba(255,255,255,.16); }
    .phase .n {
      font:700 12px/1 "IBM Plex Mono", monospace; letter-spacing:.1em;
      text-transform:uppercase; color:var(--v4-red); margin-bottom:12px;
    }
    .dark .phase .n { color:var(--v4-cream); }
    .phase h3 { margin:0 0 10px; font-size:20px; line-height:1.2; }
    .phase p { margin:0; color:var(--ink-soft); font-size:15px; line-height:1.35; }
    .dark .phase p { color:rgba(255,255,255,.72); }
    .price-hero {
      display:grid; grid-template-columns:1.1fr .9fr; gap:36px; margin-top:36px; align-items:stretch;
    }
    .price-box {
      padding:36px 40px; border-radius:28px; background:white; border:1px solid var(--line);
      min-height:340px; display:flex; flex-direction:column; justify-content:center;
    }
    .price-box .tag {
      font:700 12px/1 "IBM Plex Mono", monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--v4-red);
    }
    .price-box .amount { font-size:96px; font-weight:700; letter-spacing:-.04em; margin:12px 0 8px; line-height:1; }
    .price-box .amount span { font-size:36px; vertical-align:super; margin-right:4px; }
    .price-box p { margin:0; color:var(--ink-soft); font-size:22px; line-height:1.35; max-width:420px; }
    .clock-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:44px; }
    .clock-card {
      min-height:300px; padding:30px; border-radius:24px;
      background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    }
    .clock-card .big-number { font-size:54px; margin:18px 0 12px; }
    .clock-card h3 { margin:0 0 10px; font-size:26px; }
    .clock-card p { margin:0; color:rgba(255,255,255,.72); font-size:19px; line-height:1.35; }
    .success-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px 24px; margin-top:36px; }
    .success-item {
      display:grid; grid-template-columns:48px 1fr; gap:14px; align-items:center;
      padding:16px 18px; border-radius:18px; background:white; border:1px solid var(--line);
    }

    topline() +
    '<span class="eyebrow">' + esc(suc.headline) + "</span>" +
    '<h2 style="margin-top:28px;max-width:1180px">' + esc(suc.headline) + "</h2>" +
    '<div class="success-grid" style="margin-top:28px">' +
      suc.itens.map(function (it) {
        return '<div class="success-item">' + icon(it.icon) + "<h3>" + esc(it.title) + "</h3></div>";
      }).join("") +
    "</div>"
  ));

  const rec = P.decisao.recap;
  html.push(slide("dark", "Recap · dores e dados", "Decisão",
    '<span class="eyebrow">Recap antes da decisão</span>' +
    '<h2 style="margin-top:22px;max-width:1180px">' + esc(rec.headline) + "</h2>" +
    '<div class="split-2" style="margin-top:28px">' +
      '<div class="split-card gap" style="min-height:auto"><h3>Dores</h3>' + bullets(rec.dores) + "</div>" +
      '<div class="split-card ok" style="min-height:auto"><h3>Dados</h3>' + bullets(rec.dados) + "</div>" +
    "</div>" +
    '<div class="quote" style="margin-top:28px;font-size:24px">' + esc(rec.quote) + "</div>"
  ));

  const inv = P.decisao.investimento;
  html.push(slide("white", "Investimento", "Decisão",
    topline() +
    '<span class="eyebrow">Investimento</span>' +
    '<h2 style="margin-top:18px;max-width:1100px">' + esc(inv.headline) + "</h2>" +
    '<div class="price-layout">' +
      '<div class="price-main">' +
        '<div class="was">' + esc(inv.ancoraLabel) + "</div>" +
        '<div class="ref">' + esc(inv.ancora) + "</div>" +
        '<div class="now-label">' + esc(inv.condicaoLabel) + "</div>" +
        '<div class="now">' + raw(inv.precoHtml) + "</div>" +
        "<p>" + esc(inv.rodape) + "</p>" +
      "</div>" +
      '<div class="price-side">' +
        '<div class="box"><div class="tag">O que está incluso</div><h3>' + esc(inv.inclusoTitulo) + "</h3><p>" + esc(inv.inclusoTexto) + "</p></div>" +
        '<div class="box"><div class="tag">Por que agora</div><h3>' + esc(inv.agoraTitulo) + "</h3><p>" + esc(inv.agoraTexto) + "</p></div>" +
        '<div class="box"><div class="tag">Resultado esperado</div><h3>' + esc(inv.resultadoTitulo) + "</h3><p>" + esc(inv.resultadoTexto) + "</p></div>" +
      "</div>" +
    "</div>"
  ));

  deck.insertAdjacentHTML("afterbegin", html.join("\n"));

  const slidesEls = Array.from(document.querySelectorAll(".slide"));
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const slideCounter = document.getElementById("slideCounter");
  const progressFill = document.getElementById("progressFill");
  const footerEl = document.getElementById("slideFooter");
  let current = 0;

  function fitDeck() {
    const w = window.visualViewport?.width || window.innerWidth;
    const h = window.visualViewport?.height || window.innerHeight;
    deck.style.setProperty("--deck-scale", Math.max(.1, Math.min((w - 16) / 1600, (h - 16) / 900, 1)));
  }

  function goTo(index) {
    current = Math.max(0, Math.min(slidesEls.length - 1, index));
    slidesEls.forEach(function (s, i) { s.classList.toggle("active", i === current); });
    const number = String(current + 1).padStart(2, "0");
    const total = String(slidesEls.length).padStart(2, "0");
    const active = slidesEls[current];
    const isDark = active.classList.contains("red") || active.classList.contains("dark");
    slideCounter.textContent = number + " / " + total;
    slideCounter.style.color = isDark ? "rgba(255,255,255,.58)" : "rgba(20,20,20,.52)";
    progressFill.style.width = ((current + 1) / slidesEls.length) * 100 + "%";
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === slidesEls.length - 1;
    footerEl.classList.toggle("dark-footer", isDark);
    footerEl.style.opacity = (current === 0 || current === slidesEls.length - 1) ? "0" : "1";
    document.title = number + " | " + (active.dataset.title || P.meta.cliente);
  }

  prevBtn.onclick = function () { goTo(current - 1); };
  nextBtn.onclick = function () { goTo(current + 1); };
  window.addEventListener("resize", fitDeck);
  window.visualViewport?.addEventListener("resize", fitDeck);
  window.addEventListener("keydown", function (e) {
    if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); goTo(current + 1); }
    if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); goTo(current - 1); }
    if (e.key === "Home") goTo(0);
    if (e.key === "End") goTo(slidesEls.length - 1);
    if (e.key === "g" || e.key === "G") document.body.classList.toggle("show-acts");
  });
  let tx = null;
  deck.addEventListener("touchstart", function (e) { tx = e.changedTouches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", function (e) {
    if (tx == null) return;
    const d = e.changedTouches[0].clientX - tx;
    if (Math.abs(d) > 70) goTo(current + (d < 0 ? 1 : -1));
    tx = null;
  }, { passive: true });
  fitDeck();
  goTo(0);
})();

  </script>
</body>
</html>
